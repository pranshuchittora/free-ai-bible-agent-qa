name: Report changed or incorrect information
description: Help keep limits, availability and links useful.
title: 'Update: '
body:
  - type: input
    id: resource
    attributes:
      label: Resource name
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
      description: Describe old vs current information and your review date.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official evidence URL
    validations:
      required: true
