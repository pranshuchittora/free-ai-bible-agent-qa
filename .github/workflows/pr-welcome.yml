name: Welcome Contributors
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      # No checkout or execution of pull request code in this privileged event.
      - uses: actions/github-script@v7
        with:
          script: |
            const association = context.payload.pull_request.author_association;
            if (!['FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR'].includes(association)) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                'Welcome, and thank you for your first contribution! 👋',
                '',
                'For catalog changes, please include an official source, the review date, and whether you read documentation or tested the service.',
                'Run `python3 scripts/build-directory.py` and `python3 scripts/check-repo.py` to validate generated views.',
                '',
                'Small corrections are valuable. A maintainer will review the change when available.'
              ].join('\n')
            });
