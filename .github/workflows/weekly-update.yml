name: Source link availability
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source availability (not quota verification)
        run: python scripts/check-links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-link-report
          path: link-report.json
